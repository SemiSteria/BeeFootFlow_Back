name: Build and Publish Docker Images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker Hub username
        shell: bash
        run: |
          USERNAME_RAW='${{ secrets.DOCKERHUB_USERNAME }}'
          USERNAME_CLEAN="$(echo "$USERNAME_RAW" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$USERNAME_CLEAN" ]; then
            echo "DOCKERHUB_USERNAME is empty after cleanup."
            exit 1
          fi

          if [[ ! "$USERNAME_CLEAN" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "DOCKERHUB_USERNAME contains invalid characters for Docker tags: '$USERNAME_CLEAN'"
            exit 1
          fi

          echo "DOCKERHUB_USERNAME=$USERNAME_CLEAN" >> "$GITHUB_ENV"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/beefootflow-back:latest
            ${{ env.DOCKERHUB_USERNAME }}/beefootflow-back:sha-${{ github.sha }}